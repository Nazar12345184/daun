<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles/style.css">

</head>
<body>
    <header>
        <div class="left">
            <div class="logo">
                <img src="../templates/gg.png" alt="Logo">

            <a class="brand" href="../zra/bet.html" style="color: white; font-size: 28px; font-weight: 800; text-decoration: none;">Bet-King</a>
        </div>
        <nav class="gay">
            <button class="btn-nav" onclick="location.href='../templates/main.html'">News</button>
            <button class="btn-nav" onclick="location.href='../templates/index.html'">Matches</button>
            <button class="btn-nav" onclick="location.href='../templates/res.html'">Results</button>

                <li><span>Location</span><span>Europe (Online)</span></li>

            <div class="result-player">
                <img src="winnerz.png" alt="winnerz">
