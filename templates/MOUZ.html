<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOUZ — команда</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../styles/auth.js" defer></script>
</head>
<body>
<header>
    <div class="left">
        <div class="logo">
            <img src="gg.png" alt="Logo">
        </div>
        <a class="brand" href="../zra/bet.html">Bet-King</a>
    </div>
    <nav class="gay">
        <button class="btn-nav" onclick="location.href='../index.html'">News</button>
        <button class="btn-nav" onclick="location.href='main.html'">Matches</button>
        <button class="btn-nav" onclick="location.href='res.html'">Results</button>
        <button class="btn-nav" onclick="location.href='events.html'">Events</button>
        <button class="btn-nav active" onclick="location.href='teams.html'">Teams</button>
        <button class="btn-nav" onclick="location.href='players.html'">Players</button>
    </nav>
    <div class="header-right">
        <button class="header-signin">Sign in</button>
    </div>
</header>

<div class="container">
    <section class="profile-card team-profile-card">
        <div class="team-profile-header">
            <img class="team-profile-logo" src="../ph/m.jpg" alt="MOUZ logo">
            <div>
                <div class="team-profile-subtitle">Team</div>
                <h1>MOUZ</h1>
            </div>
        </div>

        <div class="team-tabs">
            <button class="team-tab active" type="button">Players</button>
            <button class="team-tab" type="button">Stats</button>
            <button class="team-tab" type="button">Recent Matches</button>
        </div>

        <div class="team-panel active">
            <div class="team-grid">
                <article class="team-player-card"><img class="team-player-photo" src="../ph/m.jpg" alt="xertioN from MOUZ"><h3><a href="xertioN.html">xertioN</a></h3><div class="player-role">Entry</div></article>
                <article class="team-player-card"><img class="team-player-photo" src="../ph/m.jpg" alt="torzsi from MOUZ"><h3><a href="torzsi.html">torzsi</a></h3><div class="player-role">AWP</div></article>
                <article class="team-player-card"><img class="team-player-photo" src="../ph/m.jpg" alt="Jimpphat from MOUZ"><h3><a href="Jimpphat.html">Jimpphat</a></h3><div class="player-role">Rifler</div></article>
                <article class="team-player-card"><img class="team-player-photo" src="../ph/m.jpg" alt="Spinx from MOUZ"><h3><a href="Spinx.html">Spinx</a></h3><div class="player-role">Support</div></article>
                <article class="team-player-card"><img class="team-player-photo" src="../ph/m.jpg" alt="Bymas from MOUZ"><h3><a href="Bymas.html">Bymas</a></h3><div class="player-role">IGL</div></article>
            </div>
        </div>

        <div class="team-panel">
            <div class="team-numbers">
                <div class="stat-box"><span class="label">Wins</span><span class="value">16</span></div>
                <div class="stat-box"><span class="label">Winrate</span><span class="value">64%</span></div>
                <div class="stat-box"><span class="label">K/D</span><span class="value">1.20</span></div>
                <div class="stat-box"><span class="label">HLTV</span><span class="value">#7</span></div>
            </div>
        </div>

        <div class="team-panel">
            <div class="results">
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='match4.html'">MOUZ vs FaZe</div>
                    </div>
                    <div>
                        <div class="result-score">2:1</div>
                    </div>
                </article>
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='match5.html'">MOUZ vs NAVI</div>
                    </div>
                    <div>
                        <div class="result-score">2:0</div>
                    </div>
                </article>
            </div>
        </div>
    </section>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const tabs = Array.from(document.querySelectorAll('.team-tab'));
    const panels = Array.from(document.querySelectorAll('.team-panel'));
    tabs.forEach(function (tab, index) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (item) { item.classList.toggle('active', item === tab); });
        panels.forEach(function (panel, panelIndex) { panel.classList.toggle('active', panelIndex === index); });
      });
    });
  });
</script>
</body>
</html>
