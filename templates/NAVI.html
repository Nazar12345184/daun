<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVI — команда</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../styles/auth.js" defer></script>
</head>
<body>
<header>
    <div class="left">
        <div class="logo">
            <img src="gg.png" alt="Logo">
        </div>
        <a class="brand" href="../zra/bet.html">Bet-King</a>
    </div>
    <nav class="gay">
        <button class="btn-nav" onclick="location.href='main.html'">News</button>
        <button class="btn-nav" onclick="location.href='index.html'">Matches</button>
        <button class="btn-nav" onclick="location.href='res.html'">Results</button>
        <button class="btn-nav" onclick="location.href='events.html'">Events</button>
        <button class="btn-nav active" onclick="location.href='teams.html'">Teams</button>
        <button class="btn-nav" onclick="location.href='players.html'">Players</button>
    </nav>
    <div class="header-right">
        <button class="header-signin">Sign in</button>
    </div>
</header>

<div class="container">
    <section class="profile-card team-profile-card">
        <div class="team-profile-header">
            <img class="team-profile-logo" src="../ph/n.jpg" alt="NAVI logo">
            <div>
                <div class="team-profile-subtitle">Team</div>
                <h1>NAVI</h1>
            </div>
        </div>

        <div class="team-tabs">
            <button class="team-tab active" type="button">Players</button>
            <button class="team-tab" type="button">Stats</button>
            <button class="team-tab" type="button">Recent Matches</button>
        </div>

        <div class="team-panel active">
            <div class="team-grid">
                <article class="team-player-card"><h3><a href="W0NDERFUL.html">W0NDERFUL</a></h3><div class="player-role">AWP</div></article>
                <article class="team-player-card"><h3><a href="bit.html">b1t</a></h3><div class="player-role">Entry</div></article>
                <article class="team-player-card"><h3><a href="im.html">IM</a></h3><div class="player-role">Rifler</div></article>
                <article class="team-player-card"><h3><a href="makaka.html">makazze</a></h3><div class="player-role">Lurker</div></article>
                <article class="team-player-card"><h3><a href="al.html">alexib</a></h3><div class="player-role">Captain</div></article>
            </div>
        </div>

        <div class="team-panel">
            <div class="team-numbers">
                <div class="stat-box"><span class="label">Wins</span><span class="value">19</span></div>
                <div class="stat-box"><span class="label">Winrate</span><span class="value">64%</span></div>
                <div class="stat-box"><span class="label">K/D</span><span class="value">1.31</span></div>
                <div class="stat-box"><span class="label">Top 8</span><span class="value">26</span></div>
            </div>
        </div>

        <div class="team-panel">
            <div class="results">
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='match5.html'">NAVI vs VITALITY</div>
                    </div>
                    <div>
                        <div class="result-score">2:1</div>
                    </div>
                </article>
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='match2.html'">Barbos vs NAVI</div>
                    </div>
                    <div>
                        <div class="result-score">3:2</div>
                    </div>
                </article>
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='match3.html'">team SPIRIT vs NAVI</div>
                    </div>
                    <div>
                        <div class="result-score">1:2</div>
                    </div>
                </article>
            </div>
        </div>
    </section>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const tabs = Array.from(document.querySelectorAll('.team-tab'));
    const panels = Array.from(document.querySelectorAll('.team-panel'));

    tabs.forEach(function (tab, index) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (item) {
          item.classList.toggle('active', item === tab);
        });
        panels.forEach(function (panel, panelIndex) {
          panel.classList.toggle('active', panelIndex === index);
        });
      });
    });
  });
</script>
</body>
</html>
