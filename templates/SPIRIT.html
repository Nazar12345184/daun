<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIRIT — команда</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../styles/auth.js" defer></script>
</head>
<body>
<header>
    <div class="left">
        <div class="logo">
            <img src="gg.png" alt="Logo">
        </div>
        <a class="brand" href="../zra/bet.html">Bet-King</a>
    </div>
    <nav class="gay">
        <button class="btn-nav" onclick="location.href='index.html'">News</button>
        <button class="btn-nav" onclick="location.href='main.html'">Matches</button>
        <button class="btn-nav" onclick="location.href='res.html'">Results</button>
        <button class="btn-nav" onclick="location.href='events.html'">Events</button>
        <button class="btn-nav active" onclick="location.href='teams.html'">Teams</button>
        <button class="btn-nav" onclick="location.href='players.html'">Players</button>
    </nav>
    <div class="header-right">
        <button class="header-signin">Sign in</button>
    </div>
</header>

<div class="container">
    <section class="profile-card team-profile-card">
        <div class="team-profile-header">
            <img class="team-profile-logo" src="../ph/s.png" alt="SPIRIT logo">
            <div>
                <div class="team-profile-subtitle">Team</div>
                <h1>SPIRIT</h1>
            </div>
        </div>

        <div class="team-tabs">
            <button class="team-tab active" type="button">Players</button>
            <button class="team-tab" type="button">Stats</button>
            <button class="team-tab" type="button">Recent Matches</button>
        </div>

        <div class="team-panel active">
            <div class="team-grid">
                <article class="team-player-card"><img class="team-player-photo" src="../ph/s.png" alt="donk from SPIRIT"><h3><a href="donk.html">donk</a></h3><div class="player-role">Rifle</div></article>
                <article class="team-player-card"><img class="team-player-photo" src="../ph/s.png" alt="tnir from SPIRIT"><h3><a href="tnir.html">tnir</a></h3><div class="player-role">Rifle</div></article>
                <article class="team-player-card"><img class="team-player-photo" src="../ph/s.png" alt="zont from SPIRIT"><h3><a href="zont.html">zontix</a></h3><div class="player-role">Rifle</div></article>
                <article class="team-player-card"><img class="team-player-photo" src="../ph/s.png" alt="shiro from SPIRIT"><h3><a href="shiro.html">shiro</a></h3><div class="player-role">Rifle</div></article>
                <article class="team-player-card"><img class="team-player-photo" src="../ph/s.png" alt="magix from SPIRIT"><h3><a href="magix.html">magix</a></h3><div class="player-role">Rifle</div></article>
            </div>
        </div>

        <div class="team-panel">
            <div class="team-numbers">
                <div class="stat-box"><span class="label">Wins</span><span class="value">17</span></div>
                <div class="stat-box"><span class="label">Winrate</span><span class="value">59%</span></div>
                <div class="stat-box"><span class="label">K/D</span><span class="value">1.18</span></div>
                <div class="stat-box"><span class="label">Map Wins</span><span class="value">43</span></div>
            </div>
        </div>

        <div class="team-panel">
            <div class="results">
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='match4.html'">team SPIRIT vs FALCONS</div>
                    </div>
                    <div>
                        <div class="result-score">2:0</div>
                    </div>
                </article>
                <article class="result-card">
                    <div>
                        <div class="result-title" onclick="location.href='match3.html'">team SPIRIT vs NAVI</div>
                    </div>
                    <div>
                        <div class="result-score">1:2</div>
                    </div>
                </article>
            </div>
        </div>
    </section>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const tabs = Array.from(document.querySelectorAll('.team-tab'));
    const panels = Array.from(document.querySelectorAll('.team-panel'));

    tabs.forEach(function (tab, index) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (item) {
          item.classList.toggle('active', item === tab);
        });
        panels.forEach(function (panel, panelIndex) {
          panel.classList.toggle('active', panelIndex === index);
        });
      });
    });
  });
</script>
</body>
</html>
