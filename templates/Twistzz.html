<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twistzz — Профіль гравця</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../styles/auth.js" defer></script>
</head>
<body>
<header>
    <div class="left">
        <div class="logo">
            <img src="gg.png" alt="Logo">
        </div>
        <a class="brand" href="../zra/bet.html" style="color: white; font-size: 28px; font-weight: 800; text-decoration: none;">Bet-King</a>
    </div>
    <nav class="gay">
        <button class="btn-nav" onclick="location.href='index.html'">News</button>
        <button class="btn-nav" onclick="location.href='main.html'">Matches</button>
        <button class="btn-nav" onclick="location.href='res.html'">Results</button>
        <button class="btn-nav" onclick="location.href='events.html'">Events</button>
        <button class="btn-nav" onclick="location.href='teams.html'">Teams</button>
        <button class="btn-nav" onclick="location.href='players.html'">Players</button>
    </nav>
    <div class="header-right">
        <button class="header-signin">Sign in</button>
    </div>
</header>

<div class="container">
    <section class="profile-card">
        <div class="profile-heading">
            <img class="profile-photo" src="../ph/ggg.jpg" alt="Фото Twistzz">
            <div>
                <h1>Twistzz</h1>
                <div class="subtitle">IGL</div>
            </div>
        </div>
        <p>Twistzz — ігровий лідер команди, який формує тактичні плани і вміє вести складні відновлення після втрат.</p>
        <ul class="profile-list">
            <li><span>Нік</span><span>Twistzz</span></li>
            <li><span>Команда</span><span>FaZe</span></li>
            <li><span>Роль</span><span>IGL</span></li>
            <li><span>Стиль</span><span>Тактика, контроль</span></li>
        </ul>
        <h1>Недавні матчі</h1>
        <div class="results">
            <article class="result-card">
                <div>
                    <div class="result-title" onclick="location.href='match4.html'">FaZe vs Spirit</div>
                </div>
                <div>
                    <div class="result-score">1:2</div>
                </div>
            </article>
            <article class="result-card">
                <div>
                    <div class="result-title" onclick="location.href='match5.html'">FaZe vs NAVI</div>
                </div>
                <div>
                    <div class="result-score">2:1</div>
                </div>
            </article>
        </div>
    </section>
</div>

</html>
